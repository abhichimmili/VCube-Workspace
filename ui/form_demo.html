<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" >
        <style>
            .card{
                width:450px;
                height:650px;
                margin: 30px auto;
                position: relative;
                background-color: #e9f4d3;
                border-radius: 15px;
            }
            .card-title{
                text-align: center;
                padding-top: 50px;
                color: #333;
            }
            .form{
                padding: 25px;
                position:absolute;
                top: 100px;
            }
            .form-group{
                display: flex;
                justify-content: space-between;
                margin-top: 20px;
                padding-left: 40px;
                padding-right: 40px;
            }
            .btn-reset{
                background-color: #f44336;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px 18px;
                cursor: pointer;
            }
            .btn-submit{
                background-color: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px 18px;
                cursor: pointer;
            }
            .division{
                padding-left: 40px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1 class="card-title">Registration Form</h1>
            <form class="form">
             <!-- action="/submit" method="post"> -->
                <!-- <input name="a" value="10" disabled>
                <input name="b" value="20" readonly>
                <button type="submit">Submit</button> -->
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="mobile">Mobile:</label>
                    <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required>
                </div>
                <div class="division">
                <br>
                    <label for="gender">Gender:</label>
                    
                <div class="form-group">
                    <br>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                    <input type="radio" id="other" name="gender" value="other" required>
                    <label for="other">Other</label>
                </div>
                <br>
                
                <label for="address">Address:</label><br><br>
                <textarea id="address" name="address" rows="4" cols="45" required></textarea><br><br>
                </div>
                <div class="form-group">
                    <button class="btn-reset" type="reset">Reset</button>
                    <button class="btn-submit" type="submit">Submit</button>
                </div>
            </form>
        </div>
    </body>
</html>
